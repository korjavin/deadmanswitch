{{ template "layout.html" . }}

{{ define "styles" }}
<style>
  .auth-card {
    max-width: 560px;
    margin: 96px auto;
    padding: 40px 32px;
    text-align: center;
    background: var(--bg-elev);
    border: 1px solid var(--line-1);
    box-shadow: 4px 4px 0 0 var(--line-1);
  }
  .auth-kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-2);
    margin-bottom: 14px;
  }
  .auth-title {
    font-family: var(--serif);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .auth-sub {
    color: var(--fg-1);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 auto 12px;
    max-width: 48ch;
  }
  .auth-message {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--fg-1);
    background: var(--bg-1);
    border: 1px dashed var(--line-2);
    padding: 14px 16px;
    margin: 22px auto;
    max-width: 48ch;
    text-align: left;
    line-height: 1.6;
  }
</style>
{{ end }}

{{ define "content" }}
<div class="auth-card" data-test="auth-confirmation">
  <div class="auth-kicker">· CONFIRMED</div>
  <h1 class="auth-title">Thank you for confirming.</h1>
  <p class="auth-sub">The person who chose you has been gently let know.</p>

  {{ if .Data.Message }}
  <div class="auth-message">{{ .Data.Message }}</div>
  {{ end }}

  <p class="auth-sub" style="color: var(--fg-2); font-size: 12px; margin-top: 8px;">No further action is needed from you right now.</p>
</div>
{{ end }}
