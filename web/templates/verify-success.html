{{ template "layout.html" . }}

{{ define "styles" }}
<style>
  .auth-card {
    max-width: 520px;
    margin: 96px auto;
    padding: 40px 32px;
    text-align: center;
    background: var(--bg-elev);
    border: 1px solid var(--line-1);
    box-shadow: 4px 4px 0 0 var(--line-1);
  }
  .auth-kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-2);
    margin-bottom: 14px;
  }
  .auth-title {
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .auth-sub {
    color: var(--fg-1);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 auto 28px;
    max-width: 38ch;
  }
</style>
{{ end }}

{{ define "content" }}
<div class="auth-card" data-test="auth-verify-success">
  <div class="auth-kicker">· EMAIL VERIFIED</div>
  <h1 class="auth-title">You're all set.</h1>
  <p class="auth-sub">Your account is active. Sign in whenever you're ready to write your first letter.</p>
  <a href="/login" class="btn primary lg">Sign in →</a>
</div>
{{ end }}
