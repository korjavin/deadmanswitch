{{ template "layout.html" . }}

{{ define "styles" }}
<style>
  .auth-card {
    max-width: 420px;
    margin: 64px auto;
    padding: 32px 28px;
    background: var(--bg-elev);
    border: 1px solid var(--line-1);
    box-shadow: 4px 4px 0 0 var(--line-1);
  }
  .auth-kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-2);
    margin-bottom: 10px;
  }
  .auth-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .auth-sub {
    color: var(--fg-1);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .auth-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-3);
  }
  .auth-divider::before,
  .auth-divider::after {
    content: "";
    flex: 1;
    border-top: 1px dashed var(--line-2);
  }
  .auth-foot {
    margin-top: 22px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-2);
    text-align: center;
  }
  .auth-foot a { color: var(--fg-0); }
  .password-wrap { position: relative; }
  .password-toggle {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fg-2);
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 4px 6px;
  }
  .password-toggle:hover { color: var(--fg-0); }
  .field-row-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-2);
  }
  .auth-status {
    margin-top: 14px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    border: 1px dashed var(--line-2);
    background: var(--bg-1);
  }
  .auth-status.ok { border-color: var(--line-1); }
  .auth-status.err { border-color: var(--orange); }
</style>
{{ end }}

{{ define "content" }}
<div class="auth-card" data-test="auth-login">
  <div class="auth-kicker">· WELCOME BACK</div>
  <h1 class="auth-title">Sign in to Heartbeat</h1>
  <p class="auth-sub">The letters you've written are right where you left them.</p>

  <button id="passkey-login-button" type="button" class="btn full">
    {{ template "icon-key" . }}
    <span>Sign in with passkey</span>
  </button>

  <div id="passkey-status" class="auth-status" style="display: none;"></div>

  <div class="auth-divider">OR PASSWORD</div>

  <form action="/login" method="POST">
    <div class="field">
      <div class="field-label"><span class="label">· EMAIL</span></div>
      <input type="email" id="email" name="email" class="input" required autocomplete="username webauthn" placeholder="you@example.com">
    </div>

    <div class="field">
      <div class="field-label">
        <span class="label">· PASSWORD</span>
        <a href="/forgot-password" style="font-family: var(--mono); font-size: 11px;">forgot?</a>
      </div>
      <div class="password-wrap">
        <input type="password" id="password" name="password" class="input" required autocomplete="current-password" placeholder="••••••••">
        <button type="button" class="password-toggle" data-target="password">show</button>
      </div>
    </div>

    <div class="field" style="margin-bottom: 16px;">
      <label class="row" style="gap: 8px; cursor: pointer;">
        <input type="checkbox" id="remember" name="remember" style="margin: 0;">
        <span class="label" style="color: var(--fg-1);">· Remember me</span>
      </label>
    </div>

    <button type="submit" class="btn primary full">Continue →</button>
  </form>

  <div class="auth-foot">
    New here? <a href="/register">Create your account</a>
  </div>
</div>
{{ end }}

{{ define "scripts" }}
<script>
function base64URLToArrayBuffer(base64URL) {
    const base64 = base64URL.replace(/-/g, '+').replace(/_/g, '/');
    const padLen = (4 - (base64.length % 4)) % 4;
    const padded = base64 + '='.repeat(padLen);
    const binary = atob(padded);
    const buffer = new ArrayBuffer(binary.length);
    const view = new Uint8Array(buffer);
    for (let i = 0; i < binary.length; i++) {
        view[i] = binary.charCodeAt(i);
    }
    return buffer;
}

function arrayBufferToBase64URL(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    const base64 = btoa(binary);
    return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

function serializeAssertion(credential) {
    return {
        id: credential.id,
        rawId: arrayBufferToBase64URL(credential.rawId),
        type: credential.type,
        response: {
            clientDataJSON: arrayBufferToBase64URL(credential.response.clientDataJSON),
            authenticatorData: arrayBufferToBase64URL(credential.response.authenticatorData),
            signature: arrayBufferToBase64URL(credential.response.signature),
            userHandle: credential.response.userHandle ? arrayBufferToBase64URL(credential.response.userHandle) : null
        }
    };
}

async function fetchDiscoverableOptions() {
    const beginResponse = await fetch('/login/passkey/discover/begin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
    });
    if (!beginResponse.ok) {
        throw new Error('Failed to begin login');
    }
    const opts = await beginResponse.json();
    opts.publicKey.challenge = base64URLToArrayBuffer(opts.publicKey.challenge);
    return opts;
}

async function finishDiscoverableLogin(credential) {
    const finishResponse = await fetch('/login/passkey/discover/finish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: serializeAssertion(credential) })
    });
    if (!finishResponse.ok) {
        throw new Error('Failed to complete login');
    }
    const result = await finishResponse.json();
    if (!result.success) {
        throw new Error(result.message || 'Login failed');
    }
    return result;
}

document.addEventListener('DOMContentLoaded', function() {
    const passkeyLoginButton = document.getElementById('passkey-login-button');
    const statusDiv = document.getElementById('passkey-status');

    // Tracks the in-flight conditional-UI request so the explicit-click handler
    // can cancel it before issuing its own /discover/begin call. Without this,
    // both flows write to the same webauthn_session_id cookie and the second
    // begin call orphans the first session, producing a confusing
    // "session data not found" error.
    let conditionalAbort = null;

    function showStatus(type, message) {
        statusDiv.style.display = 'block';
        statusDiv.className = 'auth-status ' + (type === 'err' ? 'err' : 'ok');
        statusDiv.textContent = message;
    }

    passkeyLoginButton.addEventListener('click', async function() {
        if (conditionalAbort) {
            conditionalAbort.abort();
            conditionalAbort = null;
        }
        passkeyLoginButton.disabled = true;
        passkeyLoginButton.innerHTML = 'Signing in…';

        try {
            const credentialRequestOptions = await fetchDiscoverableOptions();
            showStatus('ok', 'Follow your browser\'s prompt to sign in with your passkey…');
            const credential = await navigator.credentials.get({
                publicKey: credentialRequestOptions.publicKey
            });
            const result = await finishDiscoverableLogin(credential);
            showStatus('ok', 'Signed in. Redirecting…');
            window.location.href = result.redirect || '/dashboard';
        } catch (error) {
            console.error('Error logging in with passkey:', error);
            if (error && (error.name === 'NotAllowedError' || error.name === 'AbortError')) {
                statusDiv.style.display = 'none';
            } else {
                showStatus('err', 'Couldn\'t sign in with passkey: ' + error.message);
            }
            passkeyLoginButton.disabled = false;
            passkeyLoginButton.innerHTML = '<span>Sign in with passkey</span>';
        }
    });

    document.querySelectorAll('.password-toggle').forEach(function(btn) {
        btn.addEventListener('click', function() {
            const target = document.getElementById(btn.getAttribute('data-target'));
            if (!target) return;
            if (target.type === 'password') {
                target.type = 'text';
                btn.textContent = 'hide';
            } else {
                target.type = 'password';
                btn.textContent = 'show';
            }
        });
    });

    (async function tryConditionalMediation() {
        if (typeof PublicKeyCredential === 'undefined' ||
            typeof PublicKeyCredential.isConditionalMediationAvailable !== 'function') {
            return;
        }
        try {
            const available = await PublicKeyCredential.isConditionalMediationAvailable();
            if (!available) return;
            conditionalAbort = new AbortController();
            const opts = await fetchDiscoverableOptions();
            const credential = await navigator.credentials.get({
                publicKey: opts.publicKey,
                mediation: 'conditional',
                signal: conditionalAbort.signal
            });
            if (!credential) return;
            const result = await finishDiscoverableLogin(credential);
            window.location.href = result.redirect || '/dashboard';
        } catch (error) {
            if (error && (error.name === 'NotAllowedError' || error.name === 'AbortError')) {
                return;
            }
            console.warn('Conditional UI passkey login failed:', error);
        } finally {
            conditionalAbort = null;
        }
    })();
});
</script>
{{ end }}
