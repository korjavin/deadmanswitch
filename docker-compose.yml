version: "3.8"

services:
  deadmanswitch:
    # The image tag will be replaced by GitHub Actions workflow in the deploy branch
    image: ghcr.io/korjavin/deadmanswitch:b84743203fa2a3de75ab772a95f0a3d4cde91eea
    container_name: deadmanswitch
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK_NAME:-traefik_default}"
      - "traefik.http.routers.deadmanswitch.rule=Host(`${HOSTNAME}`)"
      - "traefik.http.routers.deadmanswitch.entrypoints=websecure"
      - "traefik.http.routers.deadmanswitch.tls.certresolver=myresolver"
      - "traefik.http.services.deadmanswitch.loadbalancer.server.port=8080"
    volumes:
      - ./data:/app/data
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - TG_BOT_TOKEN=${TG_BOT_TOKEN:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - DBPath=${DB_PATH:-/app/data/deadmanswitch.db}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PING_FREQUENCY=${PING_FREQUENCY:-1}
      - PING_DEADLINE=${PING_DEADLINE:-7}
      - ACCESS_CODE_EXPIRATION_DAYS=${ACCESS_CODE_EXPIRATION_DAYS:-30}
      - ACCESS_CODE_MAX_ATTEMPTS=${ACCESS_CODE_MAX_ATTEMPTS:-5}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped

networks:
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK_NAME:-traefik_default}
